<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Update to Select & JSON Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem;
            color: #e2e8f0;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            resize: vertical;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        button.primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        button.primary:active {
            transform: translateY(0);
        }

        .output-section {
            display: grid;
            gap: 2rem;
        }

        .output-card {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
        }

        .output-header {
            padding: 0.75rem 1.25rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        pre {
            padding: 1.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #bae6fd;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 50px;
        }

        .json-output {
            color: #fca5a5;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Update2SelectJSON</h1>
        <p class="subtitle">Convert SQL UPDATE statements to SELECT & JSON payloads</p>
    </header>

    <div class="input-group">
        <label for="sqlInput">SQL Update Statement</label>
        <textarea id="sqlInput" placeholder="UPDATE table SET col = 'val' WHERE id = '...';"></textarea>
        <div id="errorMsg" class="error-msg">Please enter a valid UPDATE statement.</div>
    </div>

    <div class="actions">
        <button id="convertBtn" class="primary">
            <span>Convert Statement</span>
        </button>
    </div>

    <div class="output-section">
        <div class="output-card">
            <div class="output-header">
                <span class="output-title">Generated SELECT</span>
                <button class="copy-btn" onclick="copyContent('selectOutput')">Copy SQL</button>
            </div>
            <pre id="selectOutput"></pre>
        </div>

        <div class="output-card">
            <div class="output-header">
                <span class="output-title">Payload JSON</span>
                <button class="copy-btn" onclick="copyContent('jsonOutput')">Copy JSON</button>
            </div>
            <pre id="jsonOutput" class="json-output"></pre>
        </div>
    </div>
</div>

<script>
    const sqlInput = document.getElementById('sqlInput');
    const convertBtn = document.getElementById('convertBtn');
    const selectOutput = document.getElementById('selectOutput');
    const jsonOutput = document.getElementById('jsonOutput');
    const errorMsg = document.getElementById('errorMsg');

    function convert() {
        const sql = sqlInput.value.trim();
        if (!sql) return;

        errorMsg.style.display = 'none';

        try {
            // Regex to capture Table (with optional alias), SET clause, and WHERE clause
            const updateRegex = /UPDATE\s+(.+?)\s+SET\s+(.+?)\s+WHERE\s+(.+?);?$/is;
            const match = sql.match(updateRegex);

            if (!match) {
                throw new Error("Invalid SQL format. Must be: UPDATE <table> SET <clause> WHERE <clause>");
            }

            const tablePart = match[1].trim();
            const setClause = match[2].trim();
            const whereClause = match[3].trim();

            // Parse table name and alias
            let tableName = tablePart;
            let alias = null;
            const tableParts = tablePart.split(/\s+/);
            if (tableParts.length > 1) {
                tableName = tableParts[0];
                if (tableParts.length === 2) {
                    alias = tableParts[1];
                } else if (tableParts.length === 3 && tableParts[1].toUpperCase() === 'AS') {
                    alias = tableParts[2];
                }
            }

            // Parse SET clause into JSON
            const assignments = splitSetClause(setClause);
            const jsonResult = {};

            assignments.forEach(assign => {
                const parts = assign.split('=');
                if (parts.length >= 2) {
                    let key = parts[0].trim();
                    let val = parts.slice(1).join('=').trim();
                    
                    // Remove alias from key
                    if (alias && key.startsWith(alias + ".")) {
                        key = key.substring(alias.length + 1);
                    }

                    // Remove wrapping quotes if they exist
                    if ((val.startsWith("'") && val.endsWith("'")) || (val.startsWith('"') && val.endsWith('"'))) {
                        val = val.substring(1, val.length - 1);
                    } else if (val.toLowerCase() === 'null') {
                        val = null;
                    } else if (!isNaN(val) && val !== '') {
                        val = Number(val);
                    }

                    jsonResult[key] = val;
                }
            });

            // Generate SELECT
            const selectSql = `SELECT ${alias ? alias + '.' : ''}id\nFROM ${tablePart}\nWHERE ${whereClause};`;

            // Display
            selectOutput.textContent = selectSql;
            jsonOutput.textContent = JSON.stringify(jsonResult, null, 4);

        } catch (e) {
            errorMsg.textContent = e.message;
            errorMsg.style.display = 'block';
            selectOutput.textContent = '';
            jsonOutput.textContent = '';
        }
    }

    // Helper to split SET clause by commas, ignoring commas inside single quotes
    function splitSetClause(str) {
        const result = [];
        let current = "";
        let inQuotes = false;
        
        for (let i = 0; i < str.length; i++) {
            const char = str[i];
            if (char === "'" && (i === 0 || str[i-1] !== '\\')) {
                inQuotes = !inQuotes;
            }
            if (char === ',' && !inQuotes) {
                result.push(current.trim());
                current = "";
            } else {
                current += char;
            }
        }
        if (current) result.push(current.trim());
        return result;
    }

    async function copyContent(elementId) {
        const text = document.getElementById(elementId).textContent;
        if (!text) return;
        
        try {
            await navigator.clipboard.writeText(text);
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            btn.style.color = 'var(--accent)';
            btn.style.borderColor = 'var(--accent)';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.color = '';
                btn.style.borderColor = '';
            }, 2000);
        } catch (err) {
            console.error('Failed to copy: ', err);
        }
    }

    convertBtn.addEventListener('click', convert);

    // Initial example
    sqlInput.value = "UPDATE evdr.fwta_licence_applications AS fla\nSET fla.used_returned_quota = 2\nWHERE fla.id='a1ae2399-513b-4b40-856b-bf8006034bdb';";
    convert();
</script>

</body>
</html>
