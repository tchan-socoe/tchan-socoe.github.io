<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Distance | Premium GPS Tracker</title>
    <meta name="description" content="Track your walking or running distance in real-time using high-accuracy GPS. Save your history locally.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Main Tracker Card */
        .tracker-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .tracker-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tracker-card.active::before {
            opacity: 1;
        }

        .stats-display {
            margin-bottom: 30px;
        }

        .distance-value {
            font-family: 'Outfit', sans-serif;
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 5px;
            color: var(--text);
            text-shadow: 0 0 30px var(--primary-glow);
            transition: transform 0.3s ease;
        }

        .unit {
            font-size: 1.2rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .timer {
            font-family: monospace;
            font-size: 1.4rem;
            color: var(--accent);
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            border: none;
            border-radius: 18px;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 10px 20px -5px var(--primary-glow);
        }

        .btn-start:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px -5px var(--primary-glow);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-stop {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 2px solid rgba(239, 68, 68, 0.2);
            display: none;
        }

        .btn-stop:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
        }

        .is-tracking .btn-start { display: none; }
        .is-tracking .btn-stop { display: flex; }

        /* Status Pills */
        .status-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .pill {
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
        }

        .pill-gps.active { color: var(--success); }
        .pill-gps.inactive { color: var(--danger); }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        /* History Section */
        .history-section {
            margin-top: 50px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .history-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .history-item:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .item-info .date {
            font-size: 0.8rem;
            color: var(--text-dim);
            display: block;
            margin-bottom: 4px;
        }

        .item-info .duration {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .item-distance {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-style: italic;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        @media (max-width: 400px) {
            .distance-value { font-size: 4rem; }
            .tracker-card { padding: 30px 20px; }
        }

        /* Menu Button */
        .menu-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            text-decoration: none;
            transition: all 0.3s;
        }

        .menu-link:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <a href="menu.html" class="menu-link" title="Main Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
    </a>

    <div class="container">
        <header>
            <h1>Pathfinder</h1>
            <div class="subtitle">Precision GPS Tracking</div>
        </header>

        <main>
            <div id="tracker" class="tracker-card">
                <div class="stats-display">
                    <div id="distance" class="distance-value">0.00</div>
                    <div class="unit">Kilometers</div>
                    <div id="timer" class="timer">00:00:00</div>
                </div>

                <div class="controls">
                    <button id="startBtn" class="btn btn-start">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Start Session
                    </button>
                    <button id="stopBtn" class="btn btn-stop">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"></rect></svg>
                        Stop Tracking
                    </button>
                </div>

                <div class="status-container">
                    <div id="gpsStatus" class="pill pill-gps inactive">
                        <div class="dot"></div>
                        GPS Offline
                    </div>
                    <div id="trackingStatus" class="pill">
                        Standby
                    </div>
                </div>
            </div>

            <section class="history-section">
                <div class="history-header">
                    <h2>Recent Activities</h2>
                    <button id="clearHistory" class="clear-btn">Clear All</button>
                </div>
                <div id="historyList" class="history-list">
                    <!-- History items will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // State Management
        let isTracking = false;
        let totalDistance = 0; // in km
        let lastPosition = null;
        let watchId = null;
        let startTime = null;
        let timerInterval = null;
        let history = JSON.parse(localStorage.getItem('pathfinder_history') || '[]');

        // Elements
        const distanceEl = document.getElementById('distance');
        const timerEl = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const trackerCard = document.getElementById('tracker');
        const gpsStatus = document.getElementById('gpsStatus');
        const trackingStatus = document.getElementById('trackingStatus');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistory');

        // Haversine formula to calculate distance between two points
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function toRad(deg) {
            return deg * (Math.PI / 180);
        }

        function updateTimer() {
            const now = new Date();
            const diff = now - startTime;
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            timerEl.textContent = `${h}:${m}:${s}`;
        }

        function startTracking() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser");
                return;
            }

            isTracking = true;
            totalDistance = 0;
            lastPosition = null;
            startTime = new Date();
            
            distanceEl.textContent = "0.00";
            trackerCard.classList.add('is-tracking', 'active');
            trackingStatus.textContent = "Tracking Live";
            trackingStatus.classList.add('pulse');

            // Start Timer
            timerInterval = setInterval(updateTimer, 1000);

            // Start WatchPosition
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    updateGPSStatus(true);
                    
                    const { latitude, longitude, accuracy } = position.coords;
                    
                    // Ignore low accuracy points if needed (e.g. > 50m)
                    if (accuracy > 60) return;

                    if (lastPosition) {
                        const dist = calculateDistance(
                            lastPosition.lat, lastPosition.lon,
                            latitude, longitude
                        );
                        
                        // Only add distance if it's more than a small threshold (to avoid GPS jitter)
                        if (dist > 0.005) { 
                            totalDistance += dist;
                            distanceEl.textContent = totalDistance.toFixed(2);
                        }
                    }

                    lastPosition = { lat: latitude, lon: longitude };
                },
                (error) => {
                    console.error("GPS Error:", error);
                    updateGPSStatus(false);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 5000
                }
            );
        }

        function stopTracking() {
            if (!isTracking) return;

            isTracking = false;
            clearInterval(timerInterval);
            if (watchId) navigator.geolocation.clearWatch(watchId);

            trackerCard.classList.remove('is-tracking', 'active');
            trackingStatus.textContent = "Standby";
            trackingStatus.classList.remove('pulse');

            // Save to history
            const endTime = new Date();
            const duration = timerEl.textContent;
            
            const session = {
                id: Date.now(),
                date: startTime.toLocaleDateString() + ' ' + startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                distance: totalDistance.toFixed(2),
                duration: duration
            };

            if (totalDistance > 0) {
                history.unshift(session);
                localStorage.setItem('pathfinder_history', JSON.stringify(history));
                renderHistory();
            }

            lastPosition = null;
        }

        function updateGPSStatus(active) {
            if (active) {
                gpsStatus.classList.remove('inactive');
                gpsStatus.classList.add('active');
                gpsStatus.innerHTML = '<div class="dot pulse"></div> GPS Signal Good';
            } else {
                gpsStatus.classList.remove('active');
                gpsStatus.classList.add('inactive');
                gpsStatus.innerHTML = '<div class="dot"></div> GPS Offline';
            }
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No activities recorded yet.</div>';
                return;
            }

            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="item-info">
                        <span class="date">${item.date}</span>
                        <span class="duration">${item.duration}</span>
                    </div>
                    <div class="item-distance">${item.distance} <small>km</small></div>
                </div>
            `).join('');
        }

        // Event Listeners
        startBtn.addEventListener('click', startTracking);
        stopBtn.addEventListener('click', stopTracking);
        
        clearHistoryBtn.addEventListener('click', () => {
            if (confirm("Clear all activity history?")) {
                history = [];
                localStorage.setItem('pathfinder_history', JSON.stringify(history));
                renderHistory();
            }
        });

        // Initialize
        renderHistory();

        // Initial GPS check
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                () => updateGPSStatus(true),
                () => updateGPSStatus(false)
            );
        }
    </script>
</body>
</html>
